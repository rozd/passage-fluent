name: Release

on:
  push:
    branches:
      - '*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to build'
        required: false
        type: string
        default: ''
      pr-number:
        description: 'PR number for auto-merge'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-test-archive:
    runs-on: macos-26
    outputs:
      archive-name: ${{ steps.archive.outputs.archive-name }}
      version: ${{ steps.get-version.outputs.version }}
      is-main: ${{ steps.check-branch.outputs.is-main }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      # setup-swift is not used here: it string-compares the requested version
      # against the installed one, so asking for '6.3' on a toolchain reporting
      # '6.3.3' fails the check. The macos runner image already ships the Swift
      # toolchain inside Xcode, so selecting Xcode is enough.
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Report Swift version
        run: swift --version

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            .build/checkouts
            .build/repositories
            .build/Build
          key: ${{ runner.os }}-swift-6.3-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swift-6.3-spm-

      - name: Build and test with coverage
        run: swift test --enable-code-coverage

      - name: Generate coverage report
        id: coverage
        run: |
          # Find the coverage profdata
          PROFDATA=$(find .build -name "default.profdata" -type f | head -1)

          # Find the xctest bundle and get the binary inside it
          XCTEST_BUNDLE=$(find .build -name "*.xctest" -type d | head -1)
          if [ -n "$XCTEST_BUNDLE" ]; then
            TEST_BINARY="$XCTEST_BUNDLE/Contents/MacOS/passage-fluentPackageTests"
          fi

          # Fallback for Linux-style binary (no .xctest bundle)
          if [ -z "$TEST_BINARY" ] || [ ! -f "$TEST_BINARY" ]; then
            TEST_BINARY=$(find .build -name "passage-fluentPackageTests" -type f -perm +111 | head -1)
          fi

          echo "PROFDATA: $PROFDATA"
          echo "TEST_BINARY: $TEST_BINARY"

          if [ -n "$PROFDATA" ] && [ -n "$TEST_BINARY" ] && [ -f "$TEST_BINARY" ]; then
            # Generate coverage report
            xcrun llvm-cov report "$TEST_BINARY" -instr-profile="$PROFDATA" \
              --ignore-filename-regex=".build|Tests" > coverage.txt

            # Extract coverage percentage (line coverage from TOTAL row)
            COVERAGE=$(tail -1 coverage.txt | awk '{print $10}' | sed 's/%//')
            echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
            echo "Coverage: $COVERAGE%"
            cat coverage.txt
          else
            echo "coverage=0" >> $GITHUB_OUTPUT
            echo "Could not find coverage data"
          fi

      - name: Export coverage to lcov
        run: |
          PROFDATA=$(find .build -name "default.profdata" -type f | head -1)
          XCTEST_BUNDLE=$(find .build -name "*.xctest" -type d | head -1)
          if [ -n "$XCTEST_BUNDLE" ]; then
            TEST_BINARY="$XCTEST_BUNDLE/Contents/MacOS/passage-fluentPackageTests"
          fi
          if [ -z "$TEST_BINARY" ] || [ ! -f "$TEST_BINARY" ]; then
            TEST_BINARY=$(find .build -name "passage-fluentPackageTests" -type f -perm +111 | head -1)
          fi

          if [ -n "$PROFDATA" ] && [ -n "$TEST_BINARY" ]; then
            xcrun llvm-cov export "$TEST_BINARY" \
              -instr-profile="$PROFDATA" \
              -format=lcov \
              --ignore-filename-regex=".build|Tests" > coverage.lcov
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.lcov
          fail_ci_if_error: false
          verbose: true

      - name: Check if main branch
        id: check-branch
        env:
          REF: ${{ inputs.ref || github.ref }}
        run: |
          if [[ "$REF" == "refs/heads/main" || "$REF" == "refs/heads/master" || "$REF" == "main" || "$REF" == "master" ]]; then
            echo "is-main=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-main=false" >> "$GITHUB_OUTPUT"
          fi

      # Used only to label the intermediate archive. The authoritative version
      # for a real release is computed by the calculate-version job.
      - name: Get next version
        id: get-version
        run: ./.github/scripts/next-version.sh

      - name: Create archive (intermediate releases only)
        id: archive
        if: steps.check-branch.outputs.is-main == 'false'
        env:
          VERSION: ${{ steps.get-version.outputs.version }}
          REF: ${{ inputs.ref || github.ref }}
        run: |
          BRANCH_NAME=$(echo "$REF" | sed 's|refs/heads/||' | sed 's|/|-|g')
          SHORT_SHA=$(git rev-parse --short HEAD)
          ARCHIVE_NAME="passage-fluent-${VERSION}-${BRANCH_NAME}-${SHORT_SHA}.zip"

          # Create source archive for inspection
          zip -r "${ARCHIVE_NAME}" Sources Package.swift Package.resolved README.md LICENSE 2>/dev/null || \
          zip -r "${ARCHIVE_NAME}" Sources Package.swift Package.resolved

          echo "archive-name=$ARCHIVE_NAME" >> $GITHUB_OUTPUT
          echo "Created archive: $ARCHIVE_NAME"
          ls -la "${ARCHIVE_NAME}"

      - name: Upload archive artifact
        if: steps.check-branch.outputs.is-main == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: release-archive
          path: ${{ steps.archive.outputs.archive-name }}

  intermediate-release:
    runs-on: ubuntu-latest
    needs: build-test-archive
    if: needs.build-test-archive.outputs.is-main == 'false'
    steps:
      - name: Download archive
        uses: actions/download-artifact@v4
        with:
          name: release-archive

      - name: List artifacts
        run: |
          echo "Intermediate release artifact:"
          ls -la

  auto-merge:
    runs-on: ubuntu-latest
    needs: intermediate-release
    if: inputs.pr-number != ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr-number }}
        run: |
          echo "Merging PR #${PR_NUMBER}"
          gh pr merge "${PR_NUMBER}" --squash --delete-branch

  post-merge-release:
    runs-on: ubuntu-latest
    needs: auto-merge
    if: inputs.pr-number != ''
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # Runs against main *after* the PR was merged, so the commit range picked
      # up here includes the merged work and bumps accordingly.
      - name: Calculate next version
        id: get-version
        run: ./.github/scripts/next-version.sh

      - name: Create and push tag
        env:
          VERSION: ${{ steps.get-version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin "${VERSION}"

      - name: Generate changelog
        env:
          VERSION: ${{ steps.get-version.outputs.version }}
          PREVIOUS_TAG: ${{ steps.get-version.outputs.previous-tag }}
        run: ./.github/scripts/changelog.sh

      - name: Create GitHub Release
        env:
          VERSION: ${{ steps.get-version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${VERSION}" \
            --title "Release ${VERSION}" \
            --notes-file RELEASE_NOTES.md

  calculate-version:
    runs-on: ubuntu-latest
    needs: build-test-archive
    if: needs.build-test-archive.outputs.is-main == 'true'
    outputs:
      version: ${{ steps.calculate.outputs.version }}
      previous-tag: ${{ steps.calculate.outputs.previous-tag }}
      bump: ${{ steps.calculate.outputs.bump }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate next version
        id: calculate
        run: ./.github/scripts/next-version.sh

  public-release:
    runs-on: ubuntu-latest
    needs: [build-test-archive, calculate-version]
    if: needs.build-test-archive.outputs.is-main == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push tag
        env:
          VERSION: ${{ needs.calculate-version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin "${VERSION}"

      - name: Generate changelog
        env:
          VERSION: ${{ needs.calculate-version.outputs.version }}
          PREVIOUS_TAG: ${{ needs.calculate-version.outputs.previous-tag }}
        run: ./.github/scripts/changelog.sh

      - name: Create GitHub Release
        env:
          VERSION: ${{ needs.calculate-version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${VERSION}" \
            --title "Release ${VERSION}" \
            --notes-file RELEASE_NOTES.md
